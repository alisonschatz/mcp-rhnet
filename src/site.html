<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RH Net · MCP</title>
<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f8f9fb; --text: #101828; --text-2: #475467; --muted: #98a2b3;
    --line: #e4e7ec; --line-2: #eef0f3; --accent: #3e4ccf; --accent-2: #eef0fb;
    --green: #067647; --green-bg: #ecfdf3; --red: #b42318; --red-bg: #fef3f2; --amber: #b54708; --amber-bg: #fffaeb;
    --blue: #175cd3; --blue-bg: #eff8ff; --violet: #6941c6; --violet-bg: #f4f3ff; --gray-bg: #f2f4f7;
    --hml: #f59e0b; --prd: #12b76a;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-lg: 0 12px 32px -8px rgba(16, 24, 40, .2);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0e12; --surface: #13161c; --surface-2: #181c24; --text: #eceef2; --text-2: #b0b8c6; --muted: #737d8f;
      --line: #252a35; --line-2: #1d222b; --accent: #8c95ff; --accent-2: #1d2040;
      --green: #47cd89; --green-bg: #0f2a1e; --red: #f97066; --red-bg: #2f1414; --amber: #fdb022; --amber-bg: #2c2110;
      --blue: #53b1fd; --blue-bg: #0f2236; --violet: #a48afb; --violet-bg: #211a3a; --gray-bg: #1c212b;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35); --shadow-lg: 0 12px 32px -8px rgba(0, 0, 0, .6);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-feature-settings: "tnum"; }
  main { max-width: 1000px; margin: 0 auto; padding: 0 20px 72px; }
  a { color: inherit; text-decoration: none; }
  svg { flex: none; }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; }

  /* ---------- barra superior ---------- */
  .bar { display: flex; align-items: center; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  .marca { display: flex; align-items: baseline; gap: 8px; font-size: 15px; white-space: nowrap; }
  .marca b { font-weight: 700; letter-spacing: -.02em; }
  .marca span { color: var(--muted); font-weight: 500; }
  .marca span::before { content: '/'; margin-right: 8px; color: var(--line); }
  .con { margin-left: auto; display: flex; align-items: center; min-width: 0; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
  .con .lbl { padding: 0 10px; font-size: 12px; color: var(--muted); border-right: 1px solid var(--line); height: 100%; display: grid; place-items: center; background: var(--surface-2); }
  .con code { padding: 0 10px; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .con button { height: 100%; width: 34px; border: 0; border-left: 1px solid var(--line); background: var(--surface); color: var(--text-2); cursor: pointer; display: grid; place-items: center; }
  .con button:hover { color: var(--text); background: var(--surface-2); }
  .ver { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ver i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .ver.off i { background: var(--red); }

  /* ---------- botões, chips ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 500 13px/1 inherit; cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; box-shadow: var(--shadow); }
  .btn:hover { background: var(--surface-2); }
  .btn:focus-visible, .seg button:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--text-2); }
  .btn.ghost:hover { background: var(--gray-bg); color: var(--text); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .btn[disabled] { opacity: .55; cursor: default; }
  .spin { width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: girar .7s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .chip { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--gray-bg); color: var(--text-2); }
  .chip.green { background: var(--green-bg); color: var(--green); }
  .chip.red { background: var(--red-bg); color: var(--red); }
  .chip.amber { background: var(--amber-bg); color: var(--amber); }
  .metodo { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 20px; border-radius: 5px; font: 650 10.5px/1 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: .02em; flex: none; }
  .metodo.GET { background: var(--green-bg); color: var(--green); }
  .metodo.POST { background: var(--blue-bg); color: var(--blue); }
  .metodo.PUT { background: var(--amber-bg); color: var(--amber); }
  .metodo.PATCH { background: var(--violet-bg); color: var(--violet); }
  .metodo.DELETE { background: var(--red-bg); color: var(--red); }
  kbd { font: 500 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); color: var(--text); }

  /* ---------- ambientes ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
  .envs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
  .env { display: flex; flex-direction: column; padding: 18px 20px 20px; }
  .env-head { display: flex; align-items: center; gap: 9px; }
  .env-head .dot { width: 8px; height: 8px; border-radius: 50%; }
  .env-head h2 { font-size: 15px; margin: 0; letter-spacing: -.01em; }
  .env-head .id { color: var(--muted); font-size: 12px; }
  .env-head .chip { margin-left: auto; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr 1.3fr; margin-top: 16px; }
  .metric { min-width: 0; }
  .metric + .metric { padding-left: 16px; border-left: 1px solid var(--line-2); margin-left: 16px; }
  .metric .l { font-size: 12px; color: var(--muted); }
  .metric .v { font-size: 22px; font-weight: 650; letter-spacing: -.02em; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .metric .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acao { margin-top: auto; padding-top: 18px; }
  .acao-linha { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); }
  .acao-linha .dica { color: var(--muted); }
  .drop { margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border: 1.5px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop strong { color: var(--text); font-weight: 600; }
  .drop u { color: var(--accent); text-decoration: none; font-weight: 500; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-2); }
  .verif { display: flex; align-items: center; gap: 7px; height: 32px; font-size: 12.5px; color: var(--text-2); }
  .verif.erro { color: var(--red); }
  .botoes { margin-top: 10px; display: flex; gap: 8px; align-items: center; height: 64px; padding: 0 14px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line-2); }
  .botoes .dica { margin-left: auto; font-size: 12px; color: var(--muted); }

  /* ---------- painel de comparação ---------- */
  .painel { margin-top: 16px; }
  .tabs { display: flex; gap: 2px; padding: 0 12px; box-shadow: inset 0 -1px 0 var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border: 0; background: none; color: var(--text-2); font: 500 13.5px inherit; cursor: pointer; white-space: nowrap; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { color: var(--text); }
  .tabs button.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; border-radius: 2px; background: var(--text); }
  .tabs .dot { width: 7px; height: 7px; border-radius: 50%; }
  .tabs .n { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .corpo { padding: 18px 20px 20px; }
  .cab { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .frase { margin: 0; font-size: 14px; color: var(--text-2); flex: 1; min-width: 240px; }
  .frase b { color: var(--text); font-weight: 600; }
  .versoes { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .versoes .seta { color: var(--line); }

  /* impacto: cartões que também filtram */
  .impactos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .imp { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; font: inherit; color: var(--text); transition: border-color .15s, background .15s; }
  .imp:hover { background: var(--surface-2); }
  .imp .t { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; }
  .imp .t i { width: 8px; height: 8px; border-radius: 2px; }
  .imp .n { font-size: 20px; font-weight: 650; letter-spacing: -.02em; }
  .imp .d { font-size: 12px; color: var(--muted); }
  .imp.on { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .imp[disabled] { opacity: .5; cursor: default; }
  .i-quebra { background: var(--red); } .i-atencao { background: var(--amber); } .i-info { background: var(--muted); }

  .filtros { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .cats { display: flex; gap: 6px; flex-wrap: wrap; }
  .cat { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text-2); font: 500 12.5px inherit; cursor: pointer; white-space: nowrap; }
  .cat:hover:not([disabled]) { color: var(--text); border-color: color-mix(in srgb, var(--line) 40%, var(--muted)); }
  .cat b { font-weight: 650; color: var(--muted); font-size: 11.5px; }
  .cat.on { background: var(--text); border-color: var(--text); color: var(--surface); }
  .cat.on b { color: var(--surface); opacity: .7; }
  .cat[disabled] { opacity: .4; cursor: default; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--gray-bg); border-radius: 9px; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--text-2); font: 500 12.5px inherit; cursor: pointer; white-space: nowrap; }
  .seg button:hover:not([disabled]) { color: var(--text); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .seg button[disabled] { opacity: .4; cursor: default; }
  .seg button b { font-size: 11px; color: var(--muted); }
  .busca { position: relative; margin-left: auto; width: 230px; max-width: 100%; }
  .busca svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .busca input { width: 100%; height: 32px; padding: 0 10px 0 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font: 13px inherit; outline: none; }
  .busca input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-2); }
  .limpar { background: none; border: 0; color: var(--accent); font: 500 12.5px inherit; cursor: pointer; padding: 0; }

  /* lista de operações */
  .lista { list-style: none; margin: 12px 0 0; padding: 0; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
  .lista > li + li { border-top: 1px solid var(--line-2); }
  .row { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; min-width: 0; cursor: pointer; }
  .row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .row.quebra::before { background: var(--red); } .row.atencao::before { background: var(--amber); } .row.info::before { background: var(--line); }
  .row:hover { background: var(--surface-2); }
  .row .txt { min-width: 0; flex: 1; }
  .row .p { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .r { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tags { display: flex; gap: 4px; flex: none; }
  .sit { font-size: 10.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; flex: none; }
  .sit.nova { background: var(--green-bg); color: var(--green); } .sit.removida { background: var(--red-bg); color: var(--red); } .sit.alterada { background: var(--gray-bg); color: var(--text-2); }
  .mini { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 5px; background: var(--gray-bg); color: var(--text-2); font-size: 11px; font-weight: 500; white-space: nowrap; }
  .row .chev { color: var(--muted); transition: transform .2s; flex: none; }
  li.aberto > .row { background: var(--surface-2); }
  li.aberto .chev { transform: rotate(90deg); color: var(--text); }
  .mais { width: 100%; height: 38px; border: 0; background: var(--surface-2); color: var(--accent); font: 500 13px inherit; cursor: pointer; }
  .mais:hover { background: var(--gray-bg); }
  .vazio { padding: 26px; text-align: center; color: var(--muted); font-size: 13px; }

  /* detalhe da operação */
  .det { padding: 6px 16px 16px; background: var(--surface-2); }
  .grupo { margin-top: 12px; }
  .grupo h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 11.5px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .itens { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); overflow: hidden; }
  .item { display: grid; grid-template-columns: 14px minmax(160px, 32%) 1fr; gap: 10px; padding: 9px 12px; font-size: 12.5px; align-items: start; }
  .item + .item { border-top: 1px solid var(--line-2); }
  .item .ic { width: 8px; height: 8px; border-radius: 2px; margin-top: 5px; }
  .item .loc { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--text); overflow-wrap: anywhere; }
  .item .res { color: var(--text-2); }
  .item .res b { color: var(--text); font-weight: 600; }
  .antes-depois { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .antes-depois > div { min-width: 0; }
  .antes-depois .lbl { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .antes-depois pre { margin: 0; padding: 8px 10px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line-2); font: 11.5px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; color: var(--text-2); }
  .antes-depois .a pre { background: var(--red-bg); border-color: transparent; }
  .antes-depois .b pre { background: var(--green-bg); border-color: transparent; }
  .scroll { max-height: 70vh; overflow: auto; }

  .aviso { margin-bottom: 16px; padding: 12px 14px; border-radius: 10px; background: var(--red-bg); color: var(--red); font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; transition: transform .25s, opacity .25s; z-index: 10; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast.err { background: var(--red); color: #fff; }
  .busy { pointer-events: none; opacity: .7; }

  @media (max-width: 780px) {
    main { padding: 0 14px 60px; }
    .bar { flex-wrap: wrap; gap: 10px; }
    .con { margin-left: 0; width: 100%; order: 3; }
    .ver { margin-left: auto; }
    .envs { grid-template-columns: 1fr; }
    .metrics { grid-template-columns: 1fr 1fr 1.4fr; }
    .metric + .metric { padding-left: 12px; margin-left: 12px; }
    .busca { width: 100%; margin-left: 0; }
    .seg { overflow-x: auto; max-width: 100%; }
    .imp .d { display: none; }
    .imp { padding: 9px 11px; }
    .row .tags .mini { display: none; }
    .item { grid-template-columns: 10px 1fr; }
    .item .res { grid-column: 2; }
    .antes-depois { grid-template-columns: 1fr; }
  }
.leitura { margin: 8px 0 2px; font-size: 12px; color: var(--text-2); }
.leitura b { color: var(--text); font-weight: 600; }
.onde { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 500; background: var(--surface-2); border: 1px solid var(--line, rgba(127,127,127,.25)); color: var(--text-2); white-space: nowrap; }
</style>
</head>
<body>
<main>
  <header class="bar">
    <div class="marca"><b>RH Net</b><span>MCP</span></div>
    <div class="con">
      <span class="lbl">Conector</span>
      <code class="mono" id="mcpUrl"></code>
      <button id="copiar" title="Copiar endereço do conector" aria-label="Copiar endereço do conector">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
    <span class="ver" id="ver"><i></i><span>…</span></span>
  </header>
  <div id="aviso"></div>

  <div class="envs">
    <section class="card env" id="card-rhnet-hml">
      <div class="env-head">
        <span class="dot" style="background:var(--hml)"></span>
        <h2>Homologação</h2><span class="id mono">rhnet-hml</span>
        <span class="chip">Manual</span>
      </div>
      <div class="metrics" data-metrics></div>
      <div class="acao">
        <div class="acao-linha">
          <a class="btn sm" data-spec target="_blank" rel="noopener">Abrir spec
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
          </a>
          <span class="dica">com a VPN ligada · salve com <kbd>Ctrl</kbd> <kbd>S</kbd> e envie abaixo</span>
        </div>
        <label class="drop" id="drop" for="arquivo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <span id="dropTxt"><strong>Solte o arquivo aqui</strong> ou <u>selecione</u></span>
          <input type="file" id="arquivo" hidden>
        </label>
      </div>
    </section>

    <section class="card env" id="card-rhnet-prd">
      <div class="env-head">
        <span class="dot" style="background:var(--prd)"></span>
        <h2>Produção</h2><span class="id mono">rhnet-prd</span>
        <span class="chip green">Automático</span>
      </div>
      <div class="metrics" data-metrics></div>
      <div class="acao">
        <div class="verif" data-verificada></div>
        <div class="botoes">
          <button class="btn sm" id="btnPrd">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
            <span>Atualizar agora</span>
          </button>
          <a class="btn ghost sm" data-spec target="_blank" rel="noopener">Abrir spec
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>
          </a>
        </div>
      </div>
    </section>
  </div>

  <section class="card painel">
    <nav class="tabs" id="views" role="tablist"></nav>
    <div class="corpo">
      <div class="cab">
        <p class="frase" id="frase">Carregando…</p>
        <span id="cabAcoes"></span>
      </div>
      <div class="versoes" id="versoes" hidden></div>
      <div id="painelConteudo" hidden>
        <div class="impactos" id="impactos"></div>
        <div class="filtros">
          <div class="cats" id="cats"></div>
        </div>
        <div class="filtros">
          <div class="seg" id="situacoes"></div>
          <button class="limpar" id="limpar" hidden>Limpar filtros</button>
          <div class="busca">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="filtro" type="search" placeholder="Filtrar por caminho, campo ou grupo">
          </div>
        </div>
        <div class="scroll"><ul class="lista" id="lista"></ul></div>
      </div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const HML = 'rhnet-hml', PRD = 'rhnet-prd';
const NOMES = { [HML]: 'Homologação', [PRD]: 'Produção' };
const $ = (id) => document.getElementById(id);
const card = (apiId) => $('card-' + apiId);
const q = (apiId, sel) => card(apiId).querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
const dataHora = (iso) => (iso ? new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—');
function relativo(iso) {
  if (!iso) return '—';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'agora';
  if (s < 3600) return `há ${Math.floor(s / 60)} min`;
  if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
  const d = Math.floor(s / 86400);
  return d === 1 ? 'ontem' : d < 30 ? `há ${d} dias` : new Date(iso).toLocaleDateString('pt-BR');
}
const CHEV = '<svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
const CLOCK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const UNDO = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>';
const metodoBadge = (m) => `<span class="metodo ${esc(m)}">${esc(m)}</span>`;

let toastTimer;
function toast(msg, erro = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (erro ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = 'toast' + (erro ? ' err' : '')), erro ? 6000 : 3500);
}

async function api(path, opts) {
  const r = await fetch('/api' + path, opts);
  const body = await r.json().catch(() => ({ erro: 'Resposta inválida do servidor.' }));
  if (!r.ok) throw new Error(body.erro || 'Falha.');
  return body;
}

// ================= ambientes =================
let status = null;

function renderApi(st) {
  const a = st.atual;
  const origem = st.ultimaMudanca?.origem;
  q(st.apiId, '[data-metrics]').innerHTML = `
    <div class="metric"><div class="l">Operações</div><div class="v">${a?.operacoes ?? '—'}</div></div>
    <div class="metric"><div class="l">Schemas</div><div class="v">${a?.schemas ?? '—'}</div></div>
    <div class="metric" title="${st.atualizadaEm ? dataHora(st.atualizadaEm) : ''}"><div class="l">Atualizada</div>
      <div class="v">${st.atualizadaEm ? relativo(st.atualizadaEm) : '—'}</div>
      <div class="s">${a ? esc(origem || '') || '&nbsp;' : st.modo === 'manual' ? 'envie a primeira versão' : 'aguardando download'}</div></div>`;
  card(st.apiId).querySelectorAll('[data-spec]').forEach((el) => (el.href = st.specUrl));
  const v = q(st.apiId, '[data-verificada]');
  if (v) {
    v.className = 'verif' + (st.ultimoErro ? ' erro' : '');
    v.innerHTML = st.ultimoErro
      ? `${CLOCK}<span title="${esc(st.ultimoErro)}">Falha ao verificar ${relativo(st.verificadaEm)}: ${esc(st.ultimoErro)}</span>`
      : `${CLOCK}<span title="${dataHora(st.verificadaEm)}">Verificada ${relativo(st.verificadaEm)} · confere sozinha a cada hora</span>`;
  }
}

// ================= painel de comparação =================
const POR_PAGINA = 15;
const CATS = [
  { id: 'endpoint', t: 'Endpoint' }, { id: 'seguranca', t: 'Segurança' }, { id: 'parametro', t: 'Parâmetros' },
  { id: 'corpo', t: 'Corpo' }, { id: 'resposta', t: 'Respostas' }, { id: 'exemplo', t: 'Exemplos' }, { id: 'texto', t: 'Textos' },
];
const IMPS = [
  { id: 'quebra', t: 'Quebra', d: 'pode quebrar consumidores e testes' },
  { id: 'atencao', t: 'Atenção', d: 'comportamento novo ou diferente' },
  { id: 'info', t: 'Documentação', d: 'só textos e exemplos' },
];
const VIEWS = {
  'mud-hml': { titulo: 'Mudanças em homologação', dot: 'var(--hml)', api: HML, url: `/${HML}/mudancas?`, colA: 'Anterior', colB: 'Atual', sit: { nova: 'Novas', removida: 'Removidas', alterada: 'Alteradas' }, badge: { nova: 'Nova', removida: 'Removida' } },
  'mud-prd': { titulo: 'Mudanças em produção', dot: 'var(--prd)', api: PRD, url: `/${PRD}/mudancas?`, colA: 'Anterior', colB: 'Atual', sit: { nova: 'Novas', removida: 'Removidas', alterada: 'Alteradas' }, badge: { nova: 'Nova', removida: 'Removida' } },
  // Direção produção → homologação: "o que muda quando homologação for para produção".
  'hml-prd': { titulo: 'Homologação × Produção', url: `/comparar?a=${PRD}&b=${HML}&`, colA: 'Produção', colB: 'Homologação', sit: { nova: 'Só em homologação', removida: 'Só em produção', alterada: 'Diferentes' } },
};

let view = null;
let dados = null;
let f = { impacto: null, categoria: null, situacao: null, termo: '' };
let mostrarTodas = false;
const cacheView = new Map();
const cacheOp = new Map();

const nOps = (d) => d?.operacoes?.length || 0;
const casaTermo = (o) => !f.termo || `${o.operacao} ${o.resumo} ${o.tag}`.toLowerCase().includes(f.termo);
/** Operação passa nos filtros (ignorando um deles, para as contagens dos botões). */
function passa(o, ignorar) {
  return (ignorar === 'impacto' || !f.impacto || o.porImpacto[f.impacto] > 0)
    && (ignorar === 'categoria' || !f.categoria || o.porCategoria[f.categoria] > 0)
    && (ignorar === 'situacao' || !f.situacao || o.situacao === f.situacao)
    && casaTermo(o);
}

function renderViews() {
  $('views').innerHTML = Object.entries(VIEWS).map(([id, v]) => {
    const d = cacheView.get(id);
    const n = d && d.operacoes ? nOps(d) : null;
    const dots = v.dot ? `<span class="dot" style="background:${v.dot}"></span>` : '<span class="dot" style="background:var(--hml)"></span><span class="dot" style="background:var(--prd);margin-left:-4px"></span>';
    return `<button role="tab" data-view="${id}" class="${id === view ? 'on' : ''}">${dots}${v.titulo}${n !== null ? `<span class="n">${n}</span>` : ''}</button>`;
  }).join('');
}

function frase() {
  const v = VIEWS[view];
  const r = dados.resumo.operacoes;
  if (!nOps(dados)) return view === 'hml-prd' ? '<b>Homologação e produção estão iguais.</b>' : '<b>Nenhuma diferença</b> entre a versão anterior e a atual.';
  const p = [];
  if (view === 'hml-prd') {
    if (r.novas) p.push(`<b>${plural(r.novas, 'operação entra', 'operações entram')}</b>`);
    if (r.removidas) p.push(`<b>${plural(r.removidas, 'sai', 'saem')}</b>`);
    if (r.alteradas) p.push(`<b>${plural(r.alteradas, 'muda', 'mudam')}</b>`);
    return `Quando homologação for para produção: ${p.join(', ')}.`;
  }
  if (r.novas) p.push(`<b>${plural(r.novas, 'nova', 'novas')}</b>`);
  if (r.removidas) p.push(`<b>${plural(r.removidas, 'removida', 'removidas')}</b>`);
  if (r.alteradas) p.push(`<b>${plural(r.alteradas, 'alterada', 'alteradas')}</b>`);
  return `${plural(nOps(dados), 'operação mudou', 'operações mudaram')}: ${p.join(', ')}.`;
}

function renderCabecalho() {
  const v = VIEWS[view];
  $('cabAcoes').innerHTML = '';
  $('versoes').hidden = true;
  $('painelConteudo').hidden = true;
  if (!dados) { $('frase').textContent = 'Carregando…'; return; }
  if (dados.erro) { $('frase').textContent = dados.erro; return; }
  if (dados.semAnterior) {
    $('frase').innerHTML = `<b>Ainda não há versão anterior.</b> Quando ${v.api === HML ? 'você enviar uma nova versão' : 'a spec de produção mudar'}, as diferenças aparecem aqui.`;
    return;
  }
  $('frase').innerHTML = frase();
  if (dados.anterior) {
    const st = status?.apis.find((a) => a.apiId === v.api);
    $('versoes').hidden = false;
    $('versoes').innerHTML = `Anterior · ${dataHora(dados.anterior.salvoEm)} · ${dados.anterior.operacoes} op<span class="seta">→</span>Atual · ${dataHora(st?.atualizadaEm)} · ${dados.atual.operacoes} op${st?.ultimaMudanca?.origem ? ` · ${esc(st.ultimaMudanca.origem)}` : ''}`;
    $('cabAcoes').innerHTML = `<button class="btn ghost sm" data-restaurar="${esc(dados.anterior.arquivo)}" data-api="${v.api}">${UNDO}Voltar para a anterior</button>`;
  }
  $('painelConteudo').hidden = !nOps(dados);
}

function renderFiltros() {
  if (!dados?.operacoes?.length) return;
  const ops = dados.operacoes;
  $('impactos').innerHTML = IMPS.map((i) => {
    const n = ops.filter((o) => passa(o, 'impacto') && o.porImpacto[i.id] > 0).length;
    return `<button class="imp ${f.impacto === i.id ? 'on' : ''}" data-imp="${i.id}" ${n || f.impacto === i.id ? '' : 'disabled'}>
      <span class="t"><i class="i-${i.id}"></i>${i.t}</span><span class="n">${n}</span><span class="d">${plural(n, 'operação', 'operações')} · ${i.d}</span></button>`;
  }).join('');
  $('cats').innerHTML = CATS.map((c) => {
    const n = ops.filter((o) => passa(o, 'categoria')).reduce((s, o) => s + (o.porCategoria[c.id] || 0), 0);
    return `<button class="cat ${f.categoria === c.id ? 'on' : ''}" data-cat="${c.id}" ${n || f.categoria === c.id ? '' : 'disabled'}>${c.t}<b>${n}</b></button>`;
  }).join('');
  const v = VIEWS[view];
  const sits = [{ id: null, t: 'Todas' }, ...['nova', 'removida', 'alterada'].map((s) => ({ id: s, t: v.sit[s] }))];
  $('situacoes').innerHTML = sits.map((s) => {
    const n = ops.filter((o) => passa(o, 'situacao') && (!s.id || o.situacao === s.id)).length;
    return `<button data-sit="${s.id || ''}" class="${f.situacao === s.id ? 'on' : ''}" ${n || f.situacao === s.id ? '' : 'disabled'}>${s.t}<b>${n}</b></button>`;
  }).join('');
  $('limpar').hidden = !(f.impacto || f.categoria || f.situacao || f.termo);
}

function renderLista() {
  if (!dados?.operacoes?.length) return;
  const v = VIEWS[view];
  const filtrados = dados.operacoes.map((o, k) => ({ ...o, k })).filter((o) => passa(o));
  const visiveis = mostrarTodas ? filtrados : filtrados.slice(0, POR_PAGINA);
  $('lista').innerHTML = visiveis.map((o) => {
    const cats = CATS.filter((c) => o.porCategoria[c.id]).map((c) => `<span class="mini">${c.t} ${o.porCategoria[c.id]}</span>`);
    const sit = o.situacao !== 'alterada' ? `<span class="sit ${o.situacao}">${esc((v.badge || v.sit)[o.situacao])}</span>` : '';
    return `<li data-k="${o.k}"><div class="row ${o.impacto}" title="Impacto: ${IMPS.find((i) => i.id === o.impacto)?.t}">${metodoBadge(o.metodo)}
      <div class="txt"><div class="p mono">${esc(o.path)}</div><div class="r">${esc(o.resumo)}${o.tag ? ` · ${esc(o.tag)}` : ''}</div></div>
      <span class="tags">${sit}${o.situacao === 'alterada' ? cats.slice(0, 3).join('') + (cats.length > 3 ? `<span class="mini">+${cats.length - 3}</span>` : '') : ''}</span>${CHEV}</div></li>`;
  }).join('') || '<li class="vazio">Nenhuma operação com esses filtros.</li>';
  const resto = filtrados.length - visiveis.length;
  if (resto > 0) $('lista').insertAdjacentHTML('beforeend', `<li><button class="mais" id="mais">Mostrar mais ${resto}</button></li>`);
}

function renderTudo() { renderViews(); renderCabecalho(); renderFiltros(); renderLista(); }

async function abrirView(id, { recarregar = false } = {}) {
  if (view !== id) { f = { impacto: null, categoria: null, situacao: null, termo: '' }; $('filtro').value = ''; mostrarTodas = false; }
  view = id;
  dados = recarregar ? null : cacheView.get(id) || null;
  renderTudo();
  if (dados) return;
  try { dados = await api(VIEWS[id].url); }
  catch (e) { dados = { erro: e.message }; }
  cacheView.set(id, dados);
  if (view === id) renderTudo();
}

// ---------- detalhe de uma operação ----------
const json = (v) => {
  const s = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
  return s && s.length > 4000 ? `${s.slice(0, 4000)}\n… (cortado)` : s ?? '';
};

function formatar(v) {
  if (v === undefined || v === null) return '—';
  if (typeof v !== 'object' || Array.isArray(v)) return esc(typeof v === 'string' ? v : JSON.stringify(v));
  const p = [];
  if (v.tipo) p.push(`<b>${esc(v.tipo)}</b>`);
  if (v.obrigatorio !== undefined) p.push(v.obrigatorio ? 'obrigatório' : 'opcional');
  if (v.format) p.push(esc(v.format));
  if (v.minLength !== undefined) p.push(`mín ${v.minLength}`);
  if (v.maxLength !== undefined) p.push(`máx ${v.maxLength}`);
  if (v.minimum !== undefined) p.push(`≥ ${v.minimum}`);
  if (v.maximum !== undefined) p.push(`≤ ${v.maximum}`);
  if (v.nullable) p.push('aceita null');
  if (v.pattern) p.push(`padrão <span class="mono">${esc(v.pattern)}</span>`);
  if (v.enum) p.push(`valores: ${esc(v.enum.slice(0, 10).join(', '))}${v.enum.length > 10 ? '…' : ''}`);
  return p.join(' · ');
}

function itemHtml(i, v) {
  const mostraBlocos = i.categoria === 'exemplo' || (i.categoria === 'texto' && (String(i.antes || '').length + String(i.depois || '').length > 60));
  let res = `<b>${esc(i.resumo)}</b>`;
  if (!mostraBlocos && (i.mudanca === 'adicionado' || i.mudanca === 'removido') && typeof (i.depois ?? i.antes) === 'object' && !Array.isArray(i.depois ?? i.antes)) {
    const extra = formatar(i.depois ?? i.antes);
    if (extra) res += ` · ${extra}`;
  }
  const blocos = mostraBlocos
    ? `<div class="antes-depois"><div class="a"><div class="lbl">${v.colA}</div><pre>${i.antes === undefined ? '—' : esc(json(i.antes))}</pre></div><div class="b"><div class="lbl">${v.colB}</div><pre>${i.depois === undefined ? '—' : esc(json(i.depois))}</pre></div></div>`
    : '';
  const lado = !mostraBlocos && i.mudanca === 'alterado' && (i.antes === undefined) !== (i.depois === undefined)
    ? ` <span class="onde">só em ${i.antes === undefined ? v.colB : v.colA}</span>` : '';
  return `<div class="item"><span class="ic i-${i.impacto}" title="${IMPS.find((x) => x.id === i.impacto)?.t}"></span><span class="loc">${esc(i.local)}</span><div class="res">${res}${lado}${blocos}</div></div>`;
}

async function abrirDetalhe(li, o) {
  const jaAberto = li.classList.contains('aberto');
  $('lista').querySelectorAll('li.aberto').forEach((x) => { x.classList.remove('aberto'); x.querySelector('.det')?.remove(); });
  if (jaAberto) return;
  li.classList.add('aberto');
  const box = document.createElement('div');
  box.className = 'det';
  box.innerHTML = '<p class="muted" style="margin:8px 0 0;font-size:12.5px">Carregando…</p>';
  li.appendChild(box);
  const v = VIEWS[view];
  const chave = `${view}|${o.operacao}`;
  try {
    let d = cacheOp.get(chave);
    if (!d) {
      d = await api(`${v.url}method=${encodeURIComponent(o.metodo)}&path=${encodeURIComponent(o.path)}`);
      cacheOp.set(chave, d);
    }
    const itens = d.itens.filter((i) => (!f.impacto || i.impacto === f.impacto) && (!f.categoria || i.categoria === f.categoria));
    const outros = d.itens.length - itens.length;
    box.innerHTML = `<p class="leitura">Leitura: <b>${v.colA}</b> → <b>${v.colB}</b>. O que está à esquerda da seta é ${v.colA.toLowerCase()}; à direita, ${v.colB.toLowerCase()}.</p>` + CATS.map((c) => {
      const doGrupo = itens.filter((i) => i.categoria === c.id);
      return doGrupo.length ? `<div class="grupo"><h4>${c.t} <span class="mini">${doGrupo.length}</span></h4><div class="itens">${doGrupo.map((i) => itemHtml(i, v)).join('')}</div></div>` : '';
    }).join('') + (outros ? `<p class="muted" style="margin:10px 0 0;font-size:12.5px">+ ${plural(outros, 'diferença escondida', 'diferenças escondidas')} pelos filtros.</p>` : '');
  } catch (e) {
    box.innerHTML = `<p style="color:var(--red);font-size:12.5px">${esc(e.message)}</p>`;
  }
}

$('views').onclick = (ev) => { const b = ev.target.closest('[data-view]'); if (b) abrirView(b.dataset.view); };
const aplicar = () => { mostrarTodas = false; renderFiltros(); renderLista(); };
$('impactos').onclick = (ev) => { const b = ev.target.closest('[data-imp]'); if (b && !b.disabled) { f.impacto = f.impacto === b.dataset.imp ? null : b.dataset.imp; aplicar(); } };
$('cats').onclick = (ev) => { const b = ev.target.closest('[data-cat]'); if (b && !b.disabled) { f.categoria = f.categoria === b.dataset.cat ? null : b.dataset.cat; aplicar(); } };
$('situacoes').onclick = (ev) => { const b = ev.target.closest('[data-sit]'); if (b && !b.disabled) { f.situacao = b.dataset.sit || null; aplicar(); } };
$('limpar').onclick = () => { f = { impacto: null, categoria: null, situacao: null, termo: '' }; $('filtro').value = ''; aplicar(); };
$('filtro').oninput = () => { f.termo = $('filtro').value.trim().toLowerCase(); aplicar(); };
$('lista').onclick = (ev) => {
  if (ev.target.id === 'mais') { mostrarTodas = true; renderLista(); return; }
  const row = ev.target.closest('.row');
  if (!row) return;
  const li = row.closest('li');
  abrirDetalhe(li, dados.operacoes[Number(li.dataset.k)]);
};

// ================= carregar / ações =================
async function carregar({ recarregarView = false } = {}) {
  status = await api('/status');
  $('ver').className = 'ver';
  $('ver').lastElementChild.textContent = `online · v${status.versaoServidor}`;
  const semGravar = status.apis.find((a) => !a.armazenamento.gravavel);
  $('aviso').innerHTML = semGravar ? `<div class="aviso">${esc(semGravar.armazenamento.motivo)}</div>` : '';
  status.apis.forEach(renderApi);
  if (recarregarView) { cacheView.clear(); cacheOp.clear(); }
  if (!view) {
    const hml = status.apis.find((a) => a.apiId === HML);
    view = hml?.versaoAnterior ? 'mud-hml' : hml?.atual ? 'hml-prd' : 'mud-prd';
    return abrirView(view);
  }
  return abrirView(view, { recarregar: recarregarView });
}

function mensagem(r) {
  if (r.status === 'invalida') return [`Spec inválida: ${r.erros.slice(0, 2).join('; ')}`, true];
  if (r.status === 'sem-mudancas') return ['Já estava atualizada.', false];
  if (!r.anterior) return ['Spec carregada.', false];
  const o = r.resumo.operacoes;
  return [`Spec atualizada · +${o.adicionadas} −${o.removidas} ~${o.alteradas} operações`, false];
}

async function acao(apiId, botao, fn, { depois } = {}) {
  card(apiId).classList.add('busy');
  const html = botao?.innerHTML;
  if (botao) { botao.disabled = true; botao.innerHTML = '<span class="spin"></span><span>Aguarde…</span>'; }
  try {
    const r = await fn();
    const [m, erro] = mensagem(r);
    toast(`${NOMES[apiId]}: ${m}`, erro);
    if (!erro && r.status === 'atualizada' && depois) view = depois;
  } catch (e) { toast(`${NOMES[apiId]}: ${e.message}`, true); }
  finally {
    card(apiId).classList.remove('busy');
    if (botao) { botao.disabled = false; botao.innerHTML = html; }
    carregar({ recarregarView: true }).catch(() => {});
  }
}

async function enviarArquivo(file) {
  let body = file, tipo = 'application/json';
  if (typeof CompressionStream !== 'undefined') {
    body = await new Response(file.stream().pipeThrough(new CompressionStream('gzip'))).blob();
    tipo = 'application/gzip';
  }
  return api(`/${HML}/enviar`, { method: 'POST', headers: { 'Content-Type': tipo, 'x-arquivo': encodeURIComponent(file.name) }, body });
}

const drop = $('drop');
const enviar = (f) => {
  if (!f) return;
  const antes = $('dropTxt').innerHTML;
  $('dropTxt').innerHTML = `<strong>Enviando ${esc(f.name)}…</strong>`;
  // Depois do envio, mostra direto o que mudou em homologação.
  acao(HML, null, () => enviarArquivo(f), { depois: 'mud-hml' }).finally(() => ($('dropTxt').innerHTML = antes));
};
$('arquivo').onchange = (ev) => { const f = ev.target.files[0]; ev.target.value = ''; enviar(f); };
drop.ondragover = (ev) => { ev.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = (ev) => { ev.preventDefault(); drop.classList.remove('over'); enviar(ev.dataTransfer.files[0]); };
window.addEventListener('dragover', (ev) => ev.preventDefault());
window.addEventListener('drop', (ev) => { if (ev.defaultPrevented) return; ev.preventDefault(); enviar(ev.dataTransfer?.files[0]); });

$('btnPrd').onclick = (ev) => acao(PRD, ev.currentTarget, () => api(`/${PRD}/atualizar`, { method: 'POST' }), { depois: 'mud-prd' });

$('mcpUrl').textContent = location.origin + '/mcp';
$('copiar').onclick = async () => {
  try { await navigator.clipboard.writeText(location.origin + '/mcp'); toast('Endereço do conector copiado.'); } catch {}
};

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-restaurar]');
  if (!b) return;
  const apiId = b.dataset.api;
  if (confirm(`Voltar ${NOMES[apiId]} para a versão anterior? A atual passa a ser a anterior.`)) {
    acao(apiId, b, () => api(`/${apiId}/restaurar`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ arquivo: b.dataset.restaurar }) }));
  }
});

carregar().catch((e) => {
  $('ver').className = 'ver off';
  $('ver').lastElementChild.textContent = 'fora do ar';
  $('aviso').innerHTML = `<div class="aviso">${esc(e.message)}</div>`;
});
</script>
</body>
</html>
